name: Ecosystem drift sensor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * 1'

permissions:
  contents: read

jobs:
  public-system-surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check stable public SYSTEM surfaces
        shell: bash
        run: |
          set -o pipefail
          python scripts/check_public_system_surfaces.py | tee /tmp/ecosystem-sensor.md
          cat /tmp/ecosystem-sensor.md >> "$GITHUB_STEP_SUMMARY"
